name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.27

    - name: Test
      run: |
        go test -v ./...

    - name: Build Linux
      run: |
        go build -o centaur-gateway-linux-amd64 ./cmd/gateway
        go build -o centaur-connector-linux-amd64 ./cmd/connector

    - name: Build macOS
      run: |
        GOOS=darwin GOARCH=amd64 go build -o centaur-gateway-darwin-amd64 ./cmd/gateway
        GOOS=darwin GOARCH=amd64 go build -o centaur-connector-darwin-amd64 ./cmd/connector

    - name: Build Windows
      run: |
        GOOS=windows GOARCH=amd64 go build -o centaur-gateway-windows-amd64.exe ./cmd/gateway
        GOOS=windows GOARCH=amd64 go build -o centaur-connector-windows-amd64.exe ./cmd/connector

    - name: Create Tar Archives
      run: |
        # Create archive for Linux
        mkdir -p centaur-linux-amd64/bin centaur-linux-amd64/config
        cp centaur-gateway-linux-amd64 centaur-connector-linux-amd64 centaur-linux-amd64/bin/
        cp examples/gateway.json examples/connector.json centaur-linux-amd64/config
        tar -czf centaur-linux-amd64.tar.gz centaur-linux-amd64
        
        # Create archive for macOS
        mkdir -p centaur-darwin-amd64/bin centaur-darwin-amd64/config
        cp centaur-gateway-darwin-amd64 centaur-connector-darwin-amd64 centaur-darwin-amd64/bin/
        cp examples/gateway.json examples/connector.json centaur-darwin-amd64/config
        tar -czf centaur-darwin-amd64.tar.gz centaur-darwin-amd64

        # Create archive for Windows
        mkdir -p centaur-windows-amd64/bin centaur-windows-amd64/config
        cp centaur-gateway-windows-amd64.exe centaur-connector-windows-amd64.exe centaur-windows-amd64/bin/
        cp examples/gateway.json examples/connector.json centaur-windows-amd64/config
        tar -czf centaur-windows-amd64.tar.gz centaur-windows-amd64

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Archive Linux
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./centaur-linux-amd64.tar.gz
        asset_name: centaur-linux-amd64.tar.gz
        asset_content_type: application/gzip

    - name: Upload Archive macOS
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./centaur-darwin-amd64.tar.gz
        asset_name: centaur-darwin-amd64.tar.gz
        asset_content_type: application/gzip

    - name: Upload Archive Windows
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./centaur-windows-amd64.tar.gz
        asset_name: centaur-windows-amd64.tar.gz
        asset_content_type: application/gzip
