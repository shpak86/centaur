name: Release Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27

    - name: Test
      run: |
        go test -v ./...

    - name: Build and package
      run: |
        set -euo pipefail
        for target in linux/amd64 darwin/amd64; do
          os=${target%/*}
          arch=${target#*/}
          name="centaur-${os}-${arch}"
          mkdir -p "${name}/bin" "${name}/config"
          GOOS=${os} GOARCH=${arch} go build -o "${name}/bin/centaur-gateway" ./cmd/gateway
          GOOS=${os} GOARCH=${arch} go build -o "${name}/bin/centaur-connector" ./cmd/connector
          cp examples/gateway.json examples/connector.json "${name}/config/"
          tar -czf "${name}.tar.gz" "${name}"
        done

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          centaur-linux-amd64.tar.gz
          centaur-darwin-amd64.tar.gz
